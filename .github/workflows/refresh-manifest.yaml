name: Refresh UCD Store Manifest

on:
  schedule:
    - cron: "0 2 * * 1"
    - cron: "0 2 * * 4"

  workflow_dispatch:
    inputs:
      env:
        description: "Target environment"
        required: false
        type: choice
        options:
          - "prod"
          - "preview"

permissions: {}

jobs:
  refresh:
    name: Refresh Manifest (${{ matrix.env }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: ${{ github.event_name == 'schedule' && fromJson('["prod", "preview"]') || (github.event.inputs.env && fromJson(format('["{0}"]', github.event.inputs.env)) || fromJson('["prod", "preview"]')) }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40  # v2.19.0
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: setup pnpm
        uses: pnpm/action-setup@26f6d4f2c533a43e6b5da0b4a5dd983f98f7b49a  # v6.0.4

      - name: setup node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: lts/*
          cache: pnpm

      - name: install dependencies
        run: pnpm install --frozen-lockfile

      - name: build ucdjs-scripts
        run: pnpm turbo run build --filter "./packages/ucdjs-scripts"

      - name: install to symlink
        run: pnpm install --frozen-lockfile

      - name: reindex supported versions
        env:
          BASE_URL: ${{ matrix.env == 'prod' && 'https://api.ucdjs.dev' || 'https://preview.api.ucdjs.dev' }}
          KEY: ${{ secrets.TASK_API_KEY }}
        run: |
          for attempt in 1 2 3 4 5; do
            if curl --fail-with-body -X POST \
              -H "Content-Type: application/json" \
              -H "X-UCDJS-Task-Key: $KEY" \
              -d '{}' \
              "$BASE_URL/_tasks/reindex-versions"; then
              exit 0
            fi

            if [ "$attempt" -eq 5 ]; then
              exit 1
            fi

            sleep 10
          done

      - name: refresh manifests
        env:
          UCDJS_TASK_KEY: ${{ secrets.TASK_API_KEY }}
          ENV: ${{ matrix.env }}
        run: |
          pnpm ucdjs-scripts refresh-manifests --env "$ENV"
